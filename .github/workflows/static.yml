
name: Deploy Student Internship Portal

on:
  push:
    branches: [main, rollno_v1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Repository variable VITE_API_URL must contain the verified production API base URL (ending in /api)."
            exit 1
          fi
          npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          GITHUB_PAGES: 'true'

      - name: Add GitHub Pages SPA fallback
        run: cp client/dist/index.html client/dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
